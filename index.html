<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Delivery, transformation and managed services advisory for IT services firms, GCCs and enterprise leaders. 21+ years connecting decisions, numbers, teams and operating rhythm."
    />
    <meta name="theme-color" content="#4b2e83" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100d1e" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Hrishikesh (Rishi) Salunkhe" />
    <title>Rishi Salunkhe — Delivery &amp; Transformation Advisory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      ;(function () {
        try {
          var stored = localStorage.getItem('tpo-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
