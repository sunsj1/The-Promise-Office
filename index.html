<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Delivery, transformation and managed services advisory for IT services firms, GCCs (Global Capability Centres) and enterprise leaders. 21+ years connecting decisions, numbers, teams and operating rhythm."
    />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Hrishikesh (Rishi) Salunkhe" />
    <title>Rishi Salunkhe — Delivery &amp; Transformation Advisory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      ;(function () {
        try {
          var stored = localStorage.getItem('tpo-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
          } else {
            var prefersLight =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
            document.documentElement.dataset.theme = prefersLight ? 'light' : 'dark'
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
