      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      ;(function () {
        try {
          var stored = localStorage.getItem('tpo-theme')
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script>
      // Cal.com's official bootstrap snippet. Defines window.Cal and wires up the
      // document-level click interceptor for any element with data-cal-link, so
      // BookCallButton (src/widgets/Button/index.tsx) opens an inline popup instead
      // of falling through to its target="_blank" fallback. Idempotent/safe to run
      // alongside the @calcom/embed-react getCalApi() calls in src/lib/cal.ts.
      ;(function (C, A, L) {
        var p = function (a, ar) {
          a.q.push(ar)
        }
        var d = C.document
        C.Cal =
          C.Cal ||
          function () {
            var cal = C.Cal
            var ar = arguments
            if (!cal.loaded) {
              cal.ns = {}
              cal.q = cal.q || []
              d.head.appendChild(d.createElement('script')).src = A
              cal.loaded = true
            }
            if (ar[0] === L) {
              var api = function () {
                p(api, arguments)
              }
              var namespace = ar[1]
              api.q = api.q || []
              if (typeof namespace === 'string') {
                cal.ns[namespace] = cal.ns[namespace] || api
                p(cal.ns[namespace], ar)
                p(cal, ['initNamespace', namespace])
              } else p(cal, ar)
              return
            }
            p(cal, ar)
          }
      })(window, 'https://app.cal.com/embed/embed.js', 'init')
      Cal('init', '30min', { origin: 'https://cal.com' })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
